<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración anime estilo programación: coder con capucha y auriculares entre dos monitores con código, mate, gato y paneles holográficos flotando">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1329"/>
      <stop offset="0.62" stop-color="#0a1130"/>
      <stop offset="1" stop-color="#060a1a"/>
    </linearGradient>
    <radialGradient id="cyanNeb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d5f86" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1d5f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd6e8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fd6e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGold" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#eecf74"/>
      <stop offset="1" stop-color="#c69a37"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43291a"/>
      <stop offset="1" stop-color="#2c1a10"/>
    </linearGradient>
    <linearGradient id="fuse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2342"/>
      <stop offset="1" stop-color="#0e1330"/>
    </linearGradient>
    <pattern id="poncho" width="84" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" width="18" height="20" fill="#b6422a"/>
      <rect x="18" width="18" height="20" fill="#c69a37"/>
      <rect x="36" width="18" height="20" fill="#35708c"/>
      <rect x="54" width="18" height="20" fill="#2b1c10"/>
      <rect x="72" width="12" height="20" fill="#8a2f1c"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .ln { opacity: 0.9; animation: blink 2.6s steps(1) infinite; }
    .ln--2 { animation-delay: 0.45s; }
    .ln--3 { animation-delay: 0.9s; }
    .ln--4 { animation-delay: 1.35s; }
    .ln--5 { animation-delay: 1.8s; }
    .ln--6 { animation-delay: 2.25s; }
    @keyframes blink { 0%, 88% { opacity: 0.9; } 94% { opacity: 0.12; } 100% { opacity: 0.9; } }

    .cursor { animation: caret 1.1s steps(1) infinite; }
    @keyframes caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

    .glow { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.75; } }

    .tw { animation: twinkle 2.8s ease-in-out infinite; }
    .tw--2 { animation-delay: 0.9s; }
    .tw--3 { animation-delay: 1.7s; }
    .tw--4 { animation-delay: 2.3s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

    .floatY { animation: floatY 4s ease-in-out infinite; }
    .floatY--2 { animation-delay: -1.3s; }
    .floatY--3 { animation-delay: -2.6s; }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .steam { animation: rise 4s linear infinite; opacity: 0; }
    .steam--2 { animation-delay: 2s; }
    @keyframes rise {
      0% { transform: translateY(0) translateX(0) scale(0.7); opacity: 0; }
      18% { opacity: 0.5; }
      100% { transform: translateY(-52px) translateX(12px) scale(1.6); opacity: 0; }
    }

    .key { animation: keyGlow 2s ease-in-out infinite; }
    .key--2 { animation-delay: 0.6s; }
    .key--3 { animation-delay: 1.2s; }
    @keyframes keyGlow { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    .catBreath { animation: breath 3s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
    @keyframes breath {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.045); }
    }

    .bob { animation: bob 3.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
  </style>

  <!-- ══ Habitación nocturna ══ -->
  <rect width="800" height="600" fill="url(#room)"/>
  <circle cx="400" cy="280" r="280" fill="url(#cyanNeb)"/>

  <!-- Guirnalda criolla -->
  <path d="M0 26 C150 62 330 18 480 42 C630 64 730 28 800 38" fill="none" stroke="#26324f" stroke-width="2"/>
  <g>
    <circle class="tw" cx="60" cy="38" r="5" fill="#ffb765"/>
    <circle class="tw tw--2" cx="150" cy="52" r="5" fill="#e9dcae"/>
    <circle class="tw tw--3" cx="260" cy="40" r="5" fill="#ff8a5c"/>
    <circle class="tw tw--4" cx="370" cy="34" r="5" fill="#ffb765"/>
    <circle class="tw tw--2" cx="480" cy="43" r="5" fill="#e9dcae"/>
    <circle class="tw tw--3" cx="590" cy="52" r="5" fill="#ff8a5c"/>
    <circle class="tw" cx="690" cy="40" r="5" fill="#ffb765"/>
  </g>

  <!-- Ventana con luna -->
  <g transform="translate(46 92)">
    <rect x="0" y="0" width="150" height="104" rx="4" fill="#0a1130" stroke="#2b3a5e" stroke-width="3"/>
    <line x1="75" y1="0" x2="75" y2="104" stroke="#2b3a5e" stroke-width="3"/>
    <line x1="0" y1="52" x2="150" y2="52" stroke="#2b3a5e" stroke-width="3"/>
    <circle cx="48" cy="36" r="18" fill="url(#moonGold)"/>
    <g fill="#e9dcae">
      <circle class="tw" cx="104" cy="28" r="2"/>
      <circle class="tw tw--2" cx="124" cy="70" r="1.6"/>
      <circle class="tw tw--3" cx="98" cy="82" r="1.8"/>
    </g>
  </g>

  <!-- Estante con libros -->
  <g transform="translate(604 92)">
    <rect x="0" y="0" width="150" height="86" rx="4" fill="#0b1024" stroke="#22304e" stroke-width="2"/>
    <rect x="0" y="80" width="150" height="6" fill="#22304e"/>
    <rect x="12" y="28" width="12" height="50" fill="#7a3422"/>
    <rect x="28" y="34" width="10" height="44" fill="#35708c"/>
    <rect x="42" y="24" width="13" height="54" fill="#26324f"/>
    <rect x="59" y="38" width="9" height="40" fill="#5d4530"/>
    <rect x="72" y="30" width="11" height="48" fill="#8a2f1c"/>
    <rect x="98" y="28" width="12" height="50" fill="#1f4c60"/>
    <rect x="114" y="36" width="10" height="42" fill="#26324f"/>
    <rect x="128" y="32" width="11" height="46" fill="#7a3422"/>
  </g>

  <!-- Resplandor del set -->
  <circle cx="400" cy="300" r="260" fill="url(#screenGlow)" class="glow"/>
  <circle cx="400" cy="300" r="190" fill="url(#screenGlow)" class="glow"/>

  <!-- ══ Monitores ══ -->
  <!-- Monitor izquierdo: código -->
  <g>
    <rect x="42" y="208" width="244" height="172" rx="8" fill="#050b14" stroke="#14294a" stroke-width="3"/>
    <rect x="52" y="218" width="224" height="152" rx="4" fill="#08121f"/>
    <rect x="52" y="218" width="224" height="30" fill="#1a4d63" opacity="0.18"/>
    <g>
      <rect class="ln" x="60" y="228" width="90" height="6" rx="3" fill="#37d996"/>
      <rect class="ln ln--2" x="60" y="242" width="128" height="6" rx="3" fill="#2e8f6b"/>
      <rect class="ln ln--3" x="60" y="256" width="58" height="6" rx="3" fill="#4db7d6"/>
      <rect class="ln ln--4" x="60" y="270" width="104" height="6" rx="3" fill="#37d996"/>
      <rect class="ln ln--5" x="60" y="284" width="148" height="6" rx="3" fill="#2e8f6b"/>
      <rect class="ln ln--6" x="60" y="298" width="72" height="6" rx="3" fill="#4db7d6"/>
      <rect class="ln" x="60" y="312" width="110" height="6" rx="3" fill="#37d996"/>
      <rect class="ln ln--2" x="60" y="326" width="96" height="6" rx="3" fill="#2e8f6b"/>
      <rect class="ln ln--3" x="60" y="340" width="132" height="6" rx="3" fill="#4db7d6"/>
      <rect class="cursor" x="196" y="340" width="11" height="8" fill="#d7e8e0"/>
    </g>
    <path d="M140 380 L152 380 L158 404 L130 404 Z" fill="#0b1524"/>
    <ellipse cx="144" cy="406" rx="40" ry="5" fill="#0b1524"/>
  </g>

  <!-- Monitor derecho: terminal + git -->
  <g>
    <rect x="514" y="208" width="244" height="172" rx="8" fill="#050b14" stroke="#14294a" stroke-width="3"/>
    <rect x="524" y="218" width="224" height="152" rx="4" fill="#08121f"/>
    <!-- prompt -->
    <g font-family="'Courier New',monospace" font-size="16">
      <text x="532" y="240" fill="#37d996">$</text>
      <text x="548" y="240" fill="#d4d4d4">git push origin</text>
      <text x="532" y="268" fill="#37d996">$</text>
      <text x="548" y="268" fill="#d4d4d4">npm run dev</text>
      <text x="532" y="296" fill="#7bb661">✓ ready in 842ms</text>
      <text x="532" y="324" fill="#4db7d6">Local: http://localhost</text>
      <rect class="cursor" x="700" y="314" width="11" height="8" fill="#d7e8e0"/>
    </g>
    <path d="M620 380 L632 380 L638 404 L610 404 Z" fill="#0b1524"/>
    <ellipse cx="624" cy="406" rx="40" ry="5" fill="#0b1524"/>
  </g>

  <!-- ══ Silla gamer ══ -->
  <g>
    <path d="M318 470 C300 380 310 290 348 232 L452 232 C490 290 500 380 482 470 Z" fill="#10152e"/>
    <rect x="352" y="228" width="96" height="16" rx="8" fill="#b6422a"/>
    <path d="M368 236 L432 236" stroke="#e3c874" stroke-width="3" opacity="0.8"/>
    <path d="M318 470 C312 400 316 330 336 278" stroke="#35708c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M482 470 C488 400 484 330 464 278" stroke="#35708c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ══ CODER anime, de frente ══ -->
  <g class="bob">
    <!-- torso con capucha -->
    <path d="M304 470 C304 400 326 352 368 326 C390 312 410 312 432 326 C474 352 496 400 496 470 Z" fill="url(#fuse)"/>
    <!-- franja de poncho en el pecho -->
    <path d="M318 410 L482 410 L484 428 L316 428 Z" fill="url(#poncho)" opacity="0.95"/>
    <!-- bolsillo canguro -->
    <path d="M352 436 L448 436 L440 464 L360 464 Z" fill="#0e1830" stroke="#1f4c60" stroke-width="2"/>
    <!-- cordones -->
    <g stroke="#e9dcae" stroke-width="3" stroke-linecap="round">
      <line x1="388" y1="336" x2="384" y2="366"/>
      <line x1="412" y1="336" x2="416" y2="366"/>
    </g>
    <!-- brazos hacia el teclado -->
    <path d="M312 384 C280 400 252 418 236 438 L254 454 C272 438 298 422 326 408 Z" fill="#0d1626"/>
    <path d="M488 384 C520 400 548 418 564 438 L546 454 C528 438 502 422 474 408 Z" fill="#0d1626"/>
    <!-- cabecita anime -->
    <ellipse cx="400" cy="246" rx="74" ry="80" fill="#f5d0b0"/>
    <!-- pelo animé con mechones -->
    <path d="M326 238 C324 188 358 162 400 162 C442 162 476 188 474 240
             C472 214 458 196 438 190 C446 208 448 224 444 240
             C434 206 396 196 368 206 C346 214 332 224 326 238 Z" fill="#141b3e"/>
    <path d="M340 188 C360 172 392 168 414 176" stroke="#4db7d6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M386 172 C402 168 424 172 438 182" stroke="#74aaff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- ojos brillo anime -->
    <g>
      <ellipse cx="372" cy="256" rx="11" ry="16" fill="#0e1830"/>
      <ellipse cx="428" cy="256" rx="11" ry="16" fill="#0e1830"/>
      <ellipse class="tw" cx="372" cy="252" rx="10" ry="14" fill="#6fd6e8"/>
      <ellipse class="tw tw--2" cx="428" cy="252" rx="10" ry="14" fill="#6fd6e8"/>
      <circle cx="376" cy="246" r="4" fill="#ffffff"/>
      <circle cx="432" cy="246" r="4" fill="#ffffff"/>
      <circle cx="368" cy="262" r="2.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="424" cy="262" r="2.5" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- cejas + boca -->
    <path d="M352 230 L390 226" stroke="#141b3e" stroke-width="4" stroke-linecap="round"/>
    <path d="M410 226 L448 230" stroke="#141b3e" stroke-width="4" stroke-linecap="round"/>
    <path d="M386 288 Q400 296 414 288" stroke="#8a2f1c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- mejillas -->
    <ellipse cx="348" cy="284" rx="14" ry="8" fill="#ff9a8a" opacity="0.45"/>
    <ellipse cx="452" cy="284" rx="14" ry="8" fill="#ff9a8a" opacity="0.45"/>
    <!-- auriculares -->
    <path d="M326 250 C328 188 360 160 400 160 C440 160 472 188 474 250" stroke="#10152e" stroke-width="13" fill="none" stroke-linecap="round"/>
    <rect x="312" y="238" width="30" height="52" rx="12" fill="#10152e" stroke="#6fd6e8" stroke-width="3"/>
    <rect x="458" y="238" width="30" height="52" rx="12" fill="#10152e" stroke="#6fd6e8" stroke-width="3"/>
    <path d="M472 290 L440 306" stroke="#10152e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="436" cy="308" r="7" fill="#10152e" stroke="#6fd6e8" stroke-width="2"/>
  </g>

  <!-- ══ Escritorio ══ -->
  <rect x="24" y="428" width="752" height="30" fill="url(#desk)"/>
  <rect x="24" y="428" width="752" height="5" fill="#6e4a2a"/>
  <rect x="24" y="456" width="752" height="8" fill="#160d07"/>

  <!-- Teclado RGB -->
  <g>
    <rect x="296" y="416" width="208" height="16" rx="5" fill="#111b2c" stroke="#233a50" stroke-width="1.5"/>
    <g>
      <rect class="key" x="304" y="421" width="12" height="6" rx="2" fill="#37d996"/>
      <rect class="key key--2" x="320" y="421" width="12" height="6" rx="2" fill="#4db7d6"/>
      <rect class="key key--3" x="336" y="421" width="12" height="6" rx="2" fill="#ffb84d"/>
      <rect class="key" x="352" y="421" width="12" height="6" rx="2" fill="#ff8a5c"/>
      <rect class="key key--2" x="368" y="421" width="12" height="6" rx="2" fill="#37d996"/>
      <rect class="key key--3" x="384" y="421" width="12" height="6" rx="2" fill="#4db7d6"/>
      <rect class="key" x="400" y="421" width="12" height="6" rx="2" fill="#ffb84d"/>
      <rect class="key key--2" x="416" y="421" width="12" height="6" rx="2" fill="#ff8a5c"/>
      <rect class="key key--3" x="432" y="421" width="12" height="6" rx="2" fill="#37d996"/>
      <rect class="key" x="448" y="421" width="12" height="6" rx="2" fill="#4db7d6"/>
      <rect class="key key--2" x="464" y="421" width="12" height="6" rx="2" fill="#ffb84d"/>
      <rect class="key key--3" x="480" y="421" width="16" height="6" rx="2" fill="#37d996"/>
    </g>
  </g>

  <!-- Gato aprendiendo a programar -->
  <g transform="translate(118 442)">
    <g class="catBreath">
      <ellipse cx="0" cy="8" rx="34" ry="12" fill="#1b2342"/>
      <circle cx="-10" cy="-10" r="18" fill="#1b2342"/>
      <path d="M-24 -22 L-20 -34 L-10 -24 Z" fill="#1b2342"/>
      <path d="M-4 -26 L2 -36 L8 -24 Z" fill="#1b2342"/>
      <path d="M-20 0 Q0 8 18 2" stroke="#4db7d6" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-16" cy="-10" r="2.2" fill="#6fd6e8"/>
      <circle cx="-4" cy="-10" r="2.2" fill="#6fd6e8"/>
      <path d="M-14 -4 Q-10 -1 -6 -4" stroke="#6fd6e8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <text x="16" y="-30" font-family="'Courier New',monospace" font-size="14" fill="#6fd6e8" class="tw">z</text>
    <text x="28" y="-42" font-family="'Courier New',monospace" font-size="17" fill="#6fd6e8" class="tw tw--2">z</text>
    <text x="42" y="-56" font-family="'Courier New',monospace" font-size="20" fill="#6fd6e8" class="tw tw--3">Z</text>
  </g>

  <!-- ══ Mate con bombilla ══ -->
  <g transform="translate(688 438)">
    <ellipse cx="0" cy="20" rx="28" ry="7" fill="#0a0603"/>
    <path d="M0 -26 C-15 -18 -20 4 -13 24 Q-9 38 0 38 Q9 38 13 24 C20 4 15 -18 0 -26 Z" fill="#6b3d1f" stroke="#241408" stroke-width="2"/>
    <ellipse cx="0" cy="-26" rx="9" ry="4" fill="#33200f"/>
    <path d="M10 -40 L3 -20" stroke="#b8c4cc" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="10.5" cy="-41" r="3" fill="#b8c4cc"/>
    <path class="steam" d="M0 -32 q 5 -7 0 -14 q -5 -7 0 -13" fill="none" stroke="#e9dcae" stroke-width="2.2" stroke-linecap="round"/>
    <path class="steam steam--2" d="M6 -28 q 5 -8 0 -16 q -4 -7 1 -14" fill="none" stroke="#e9dcae" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ══ Paneles HUD flotantes ══ -->
  <g class="floatY">
    <rect x="136" y="116" width="84" height="48" rx="8" fill="#071019" stroke="#1f5f7d" stroke-width="2" opacity="0.97"/>
    <text x="178" y="148" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" fill="#4db7d6">{  }</text>
  </g>
  <g class="floatY floatY--2">
    <rect x="580" y="116" width="84" height="48" rx="8" fill="#071019" stroke="#1f5f7d" stroke-width="2" opacity="0.97"/>
    <text x="622" y="148" text-anchor="middle" font-family="'Courier New',monospace" font-size="19" fill="#37d996">&lt;/&gt;</text>
  </g>
  <g class="floatY floatY--3">
    <rect x="358" y="64" width="84" height="44" rx="8" fill="#071019" stroke="#8a6a16" stroke-width="2" opacity="0.97"/>
    <text x="400" y="92" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" fill="#ffb84d">⚡ 100%</text>
  </g>

  <!-- Post-its -->
  <rect x="262" y="228" width="24" height="24" fill="#ffd66b" stroke="#8a6a16" stroke-width="1.5" transform="rotate(4 274 240)"/>
  <rect x="514" y="228" width="24" height="24" fill="#ff8f7e" stroke="#8a4a40" stroke-width="1.5" transform="rotate(-3 526 240)"/>

  <!-- Reflexiones de escritorio -->
  <g fill="#4db7d6">
    <rect x="330" y="486" width="90" height="3" rx="1.5" opacity="0.16"/>
    <rect x="300" y="512" width="60" height="3" rx="1.5" opacity="0.1"/>
    <rect x="680" y="490" width="70" height="3" rx="1.5" opacity="0.12"/>
  </g>

  <!-- Texto vertical japonés -->
  <text x="779" y="34" font-size="21" fill="#4db7d6" opacity="0.85" writing-mode="vertical-rl" letter-spacing="7" font-family="'Noto Serif JP',serif">経験・夜勤</text>

  <!-- Leyenda tiptográfica -->
  <text x="40" y="566" font-size="13" fill="#e9dcae" opacity="0.7" font-family="'Special Elite','Courier New',monospace" letter-spacing="2">EXPERIENCE ✶ 夜勤 ✶ CODE &amp; MATE</text>

  <!-- Franja de poncho -->
  <rect x="0" y="580" width="800" height="20" fill="url(#poncho)"/>
  <rect x="0" y="578" width="800" height="3" fill="#2b1c10" opacity="0.7"/>
</svg>
