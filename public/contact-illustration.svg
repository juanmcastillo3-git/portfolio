<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Sobre postal vintage flotando bajo el cielo estelar de la pampa">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d33"/>
      <stop offset="1" stop-color="#10121f"/>
    </linearGradient>
    <radialGradient id="nebRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a3422" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a3422" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebCel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35708c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#35708c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGold" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#eecf74"/>
      <stop offset="1" stop-color="#c69a37"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ecd9ae"/>
      <stop offset="1" stop-color="#d9bc82"/>
    </linearGradient>
    <pattern id="poncho" width="84" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" width="18" height="20" fill="#b6422a"/>
      <rect x="18" width="18" height="20" fill="#c69a37"/>
      <rect x="36" width="18" height="20" fill="#35708c"/>
      <rect x="54" width="18" height="20" fill="#2b1c10"/>
      <rect x="72" width="12" height="20" fill="#8a2f1c"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ══ Cielo nocturno ══ -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="640" cy="430" r="260" fill="url(#nebRed)"/>
  <circle cx="110" cy="130" r="210" fill="url(#nebCel)"/>

  <!-- Estrellas -->
  <g fill="#ecd9a5">
    <circle cx="40" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="90" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="150" cy="40" r="1.8" opacity="0.8"/>
    <circle cx="210" cy="90" r="1.1" opacity="0.5"/>
    <circle cx="260" cy="150" r="1.4" opacity="0.7"/>
    <circle cx="320" cy="60" r="1.2" opacity="0.55"/>
    <circle cx="370" cy="110" r="1.7" opacity="0.85"/>
    <circle cx="430" cy="40" r="1.3" opacity="0.6"/>
    <circle cx="500" cy="80" r="1.5" opacity="0.75"/>
    <circle cx="560" cy="30" r="1.1" opacity="0.5"/>
    <circle cx="620" cy="70" r="1.6" opacity="0.8"/>
    <circle cx="680" cy="40" r="1.2" opacity="0.55"/>
    <circle cx="740" cy="110" r="1.7" opacity="0.85"/>
    <circle cx="770" cy="60" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="210" r="1.3" opacity="0.6"/>
    <circle cx="130" cy="260" r="1.5" opacity="0.7"/>
    <circle cx="700" cy="210" r="1.4" opacity="0.66"/>
    <circle cx="755" cy="255" r="1.6" opacity="0.8"/>
    <circle cx="30" cy="320" r="1.4" opacity="0.6"/>
    <circle cx="770" cy="350" r="1.5" opacity="0.7"/>
    <circle cx="50" cy="420" r="1.3" opacity="0.55"/>
    <circle cx="740" cy="430" r="1.4" opacity="0.6"/>
    <circle cx="300" cy="200" r="1.2" opacity="0.5"/>
    <circle cx="520" cy="175" r="1.4" opacity="0.6"/>
  </g>

  <!-- Destellos en cruz -->
  <g stroke="#ecd9a5" stroke-width="1.5" opacity="0.8" stroke-linecap="round">
    <path d="M-8 0 H8 M0 -8 V8" transform="translate(185 180)"/>
    <path d="M-8 0 H8 M0 -8 V8" transform="translate(600 120) scale(0.8)"/>
    <path d="M-8 0 H8 M0 -8 V8" transform="translate(100 350) scale(0.7)"/>
    <path d="M-8 0 H8 M0 -8 V8" transform="translate(560 240) scale(0.6)"/>
  </g>

  <!-- Estrella fugaz -->
  <line x1="200" y1="70" x2="300" y2="105" stroke="#ecd9a5" stroke-width="1.5"
        stroke-dasharray="7 5" opacity="0.45" stroke-linecap="round"/>
  <path d="M-6 0 H6 M0 -6 V6" transform="translate(304 106) scale(0.7)"
        stroke="#c69a37" stroke-width="2" opacity="0.9" stroke-linecap="round" fill="none"/>

  <!-- Sol de mayo convertido en estrella -->
  <g>
    <circle cx="640" cy="150" r="82" fill="#c69a37" opacity="0.10"/>
    <circle cx="640" cy="150" r="64" fill="#c69a37" opacity="0.12"/>
    <g stroke="#c69a37" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="692" y1="150" x2="712" y2="150"/>
      <line x1="685" y1="176" x2="702" y2="186"/>
      <line x1="666" y1="195" x2="676" y2="212"/>
      <line x1="640" y1="202" x2="640" y2="222"/>
      <line x1="614" y1="195" x2="604" y2="212"/>
      <line x1="595" y1="176" x2="578" y2="186"/>
      <line x1="588" y1="150" x2="568" y2="150"/>
      <line x1="595" y1="124" x2="578" y2="114"/>
      <line x1="614" y1="105" x2="604" y2="88"/>
      <line x1="640" y1="98" x2="640" y2="78"/>
      <line x1="666" y1="105" x2="676" y2="88"/>
      <line x1="685" y1="124" x2="702" y2="114"/>
    </g>
    <circle cx="640" cy="150" r="46" fill="url(#moonGold)" stroke="#8a2f1c" stroke-width="2"/>
    <circle cx="640" cy="150" r="50" fill="none" stroke="#2b1c10" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 5"/>
  </g>

  <!-- Líneas de velocidad de manga -->
  <g fill="#ecd9ae">
    <rect x="55" y="330" width="150" height="3" rx="1.5" opacity="0.22"/>
    <rect x="20" y="365" width="95" height="3" rx="1.5" opacity="0.16"/>
    <rect x="70" y="400" width="130" height="3" rx="1.5" opacity="0.19"/>
    <rect x="620" y="300" width="120" height="3" rx="1.5" opacity="0.18"/>
    <rect x="660" y="335" width="90" height="3" rx="1.5" opacity="0.12"/>
  </g>

  <!-- Pétalos de sakura volando -->
  <g fill="#cf8a72">
    <ellipse cx="245" cy="165" rx="10" ry="4.5" transform="rotate(-24 245 165)" opacity="0.8"/>
    <ellipse cx="305" cy="128" rx="12" ry="5" transform="rotate(18 305 128)" opacity="0.7"/>
    <ellipse cx="365" cy="98" rx="9" ry="4" transform="rotate(-40 365 98)" opacity="0.75"/>
    <ellipse cx="205" cy="222" rx="11" ry="4.5" transform="rotate(30 205 222)" opacity="0.6"/>
    <ellipse cx="440" cy="140" rx="10" ry="4.5" transform="rotate(-12 440 140)" opacity="0.65"/>
    <ellipse cx="510" cy="112" rx="8" ry="3.5" transform="rotate(36 510 112)" opacity="0.55"/>
  </g>

  <!-- Sierras pampeanas -->
  <path d="M0 600 V500 L90 440 L180 505 L300 430 L420 510 L540 445 L650 515 L800 455 V600 Z" fill="#1d2036"/>
  <path d="M0 600 V520 L120 470 L260 540 L400 480 L560 545 L680 495 L800 545 V600 Z" fill="#14172b"/>
  <!-- Bandadas nocturnas -->
  <g stroke="#e6d3a8" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M84 470 Q92 463 100 470"/>
    <path d="M112 458 Q120 451 128 458"/>
    <path d="M142 466 Q150 459 158 466"/>
  </g>

  <!-- ══ Sobre postal vintage ══ -->
  <ellipse cx="412" cy="452" rx="190" ry="24" fill="#0a0602" opacity="0.4" filter="url(#soft)"/>

  <g transform="translate(400 340) rotate(-4)">
    <!-- cuerpo -->
    <rect x="-170" y="-105" width="340" height="200" fill="url(#paper)" stroke="#2b1c10" stroke-width="2.5"/>
    <!-- marco fileteado interior -->
    <rect x="-156" y="-91" width="312" height="172" fill="none" stroke="#b6422a" stroke-width="1.2" opacity="0.55"/>
    <rect x="-150" y="-85" width="300" height="160" fill="none" stroke="#2b1c10" stroke-width="0.8" opacity="0.3"/>
    <!-- pliegue inferior -->
    <path d="M-170 95 L0 -5 L170 95" fill="none" stroke="#2b1c10" stroke-width="1.6" opacity="0.5"/>

    <!-- estampilla postal -->
    <g transform="translate(86 -90)">
      <rect width="70" height="54" fill="#f0e3bd" stroke="#2b1c10" stroke-width="1.5"/>
      <rect x="4" y="4" width="62" height="46" fill="none" stroke="#2b1c10" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
      <rect x="9" y="9" width="52" height="36" fill="#cfe4ee"/>
      <circle cx="48" cy="19" r="7" fill="#c69a37"/>
      <path d="M9 45 L26 30 L38 38 L50 27 L61 36 V45 Z" fill="#5d4530"/>
    </g>
    <!-- matasellos -->
    <g stroke="#2b1c10" fill="none" opacity="0.55">
      <circle cx="66" cy="-58" r="27" stroke-width="1.5"/>
      <circle cx="66" cy="-58" r="20" stroke-width="1" stroke-dasharray="3 3"/>
    </g>
    <text x="66" y="-53" text-anchor="middle" font-size="11"
          font-family="'Special Elite','Courier New',monospace" fill="#2b1c10" opacity="0.7">1972</text>

    <!-- líneas de dirección -->
    <g stroke="#2b1c10" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
      <line x1="-146" y1="-34" x2="10" y2="-34"/>
      <line x1="-146" y1="-6" x2="-16" y2="-6"/>
      <line x1="-146" y1="22" x2="24" y2="22"/>
    </g>
    <text x="-158" y="-30" font-size="14" fill="#b6422a">✶</text>

    <!-- sello de lacre -->
    <g>
      <circle cx="112" cy="62" r="26" fill="#b6422a" stroke="#8a2f1c" stroke-width="2.5"/>
      <circle cx="112" cy="62" r="19" fill="none" stroke="#ecd9ae" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>
      <text x="112" y="69" text-anchor="middle" font-size="18" fill="#ecd9ae">✶</text>
    </g>

    <!-- ráfaga de viento tras el sobre -->
    <path d="M182 60 q 42 26 96 12 q -40 12 -96 -12 Z" fill="#8cc4d9" opacity="0.5"/>
    <g stroke="#8cc4d9" stroke-width="2.5" stroke-linecap="round" opacity="0.45" fill="none">
      <path d="M252 44 h 46"/>
      <path d="M262 60 h 34"/>
      <path d="M270 76 h 24"/>
    </g>
  </g>

  <!-- Texto vertical japonés -->
  <text x="748" y="52" font-size="24" fill="#c69a37" opacity="0.9"
        writing-mode="vertical-rl" letter-spacing="8" font-family="'Noto Serif JP',serif">コンタクト・連絡先</text>

  <!-- Leyenda tiptográfica -->
  <text x="40" y="566" font-size="13" fill="#ecd9ae" opacity="0.7"
        font-family="'Special Elite','Courier New',monospace" letter-spacing="2">BUENOS AIRES ✶ 定期便 ✶ 1972</text>

  <!-- Franja de poncho -->
  <rect x="0" y="580" width="800" height="20" fill="url(#poncho)"/>
  <rect x="0" y="578" width="800" height="3" fill="#2b1c10" opacity="0.7"/>
</svg>
