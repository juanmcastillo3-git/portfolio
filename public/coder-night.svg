<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración animada: perfil nocturno de un developer con capucha frente al código, con mate y guirnalda criolla">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1329"/>
      <stop offset="0.62" stop-color="#0a1130"/>
      <stop offset="1" stop-color="#060a1a"/>
    </linearGradient>
    <radialGradient id="cyanNeb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d5f86" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1d5f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd6e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6fd6e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffcf8b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43291a"/>
      <stop offset="1" stop-color="#2c1a10"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a33"/>
      <stop offset="1" stop-color="#0b1024"/>
    </linearGradient>
    <pattern id="poncho" width="84" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" width="18" height="20" fill="#b6422a"/>
      <rect x="18" width="18" height="20" fill="#c69a37"/>
      <rect x="36" width="18" height="20" fill="#35708c"/>
      <rect x="54" width="18" height="20" fill="#2b1c10"/>
      <rect x="72" width="12" height="20" fill="#8a2f1c"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .ln { opacity: 0.9; animation: blink 2.6s steps(1) infinite; }
    .ln--2 { animation-delay: 0.45s; }
    .ln--3 { animation-delay: 0.9s; }
    .ln--4 { animation-delay: 1.35s; }
    .ln--5 { animation-delay: 1.8s; }
    .ln--6 { animation-delay: 2.25s; }
    @keyframes blink { 0%, 88% { opacity: 0.9; } 94% { opacity: 0.12; } 100% { opacity: 0.9; } }

    .cursor { animation: caret 1.1s steps(1) infinite; }
    @keyframes caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

    .glow { animation: pulse 3.6s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.8; } }

    .steam { animation: rise 4s linear infinite; opacity: 0; }
    .steam--2 { animation-delay: 2s; }
    @keyframes rise {
      0% { transform: translateY(0px) translateX(0px) scale(0.7); opacity: 0; }
      18% { opacity: 0.5; }
      100% { transform: translateY(-52px) translateX(12px) scale(1.6); opacity: 0; }
    }

    .tw { animation: twinkle 2.8s ease-in-out infinite; }
    .tw--2 { animation-delay: 0.9s; }
    .tw--3 { animation-delay: 1.7s; }
    .tw--4 { animation-delay: 2.3s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <!-- ══ Habitación nocturna ══ -->
  <rect width="800" height="600" fill="url(#room)"/>
  <circle cx="580" cy="260" r="270" fill="url(#cyanNeb)"/>

  <!-- Guirnalda criolla de luces cruzando la pared -->
  <path d="M0 26 C150 62 330 18 480 42 C630 64 730 28 800 38"
        fill="none" stroke="#26324f" stroke-width="2"/>
  <g>
    <circle class="tw" cx="60" cy="38" r="5" fill="#ffb765"/>
    <circle class="tw tw--2" cx="150" cy="52" r="5" fill="#e9dcae"/>
    <circle class="tw tw--3" cx="260" cy="40" r="5" fill="#ff8a5c"/>
    <circle class="tw tw--4" cx="370" cy="34" r="5" fill="#ffb765"/>
    <circle class="tw tw--2" cx="480" cy="43" r="5" fill="#e9dcae"/>
    <circle class="tw tw--3" cx="590" cy="52" r="5" fill="#ff8a5c"/>
    <circle class="tw" cx="690" cy="40" r="5" fill="#ffb765"/>
  </g>
  <g opacity="0.5" filter="url(#soft)">
    <circle cx="370" cy="34" r="16" fill="#ffb765" opacity="0.35"/>
    <circle cx="590" cy="52" r="16" fill="#ff8a5c" opacity="0.3"/>
  </g>

  <!-- Estante con cintas y libros -->
  <g transform="translate(46 120)">
    <rect x="0" y="0" width="210" height="96" rx="4" fill="url(#shelf)" stroke="#22304e" stroke-width="2"/>
    <rect x="0" y="90" width="210" height="7" fill="#22304e"/>
    <g>
      <rect x="14" y="34" width="13" height="54" fill="#7a3422"/>
      <rect x="30" y="40" width="10" height="48" fill="#35708c"/>
      <rect x="44" y="30" width="15" height="58" fill="#26324f"/>
      <rect x="63" y="44" width="9" height="44" fill="#5d4530"/>
      <rect x="76" y="36" width="12" height="52" fill="#8a2f1c"/>
      <rect x="98" y="34" width="14" height="54" fill="#1f4c60"/>
      <rect x="116" y="42" width="10" height="46" fill="#26324f"/>
      <rect x="130" y="30" width="13" height="58" fill="#7a3422"/>
      <rect x="147" y="38" width="11" height="50" fill="#35708c"/>
      <rect x="162" y="34" width="12" height="54" fill="#26324f"/>
      <rect x="178" y="44" width="9" height="44" fill="#8a2f1c"/>
      <rect x="191" y="34" width="12" height="54" fill="#1f4c60"/>
    </g>
  </g>

  <!-- Póster del Sol de Mayo -->
  <g transform="translate(96 240)">
    <rect x="-32" y="-36" width="64" height="76" fill="#10173a" stroke="#2b3a5e" stroke-width="2"/>
    <circle cx="0" cy="2" r="15" fill="#c69a37"/>
    <g stroke="#c69a37" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-17"/>
      <line x1="0" y1="21" x2="0" y2="28"/>
      <line x1="-23" y1="2" x2="-16" y2="2"/>
      <line x1="16" y1="2" x2="23" y2="2"/>
      <line x1="-17" y1="-15" x2="-12" y2="-10"/>
      <line x1="12" y1="-10" x2="17" y2="-15"/>
      <line x1="-17" y1="19" x2="-12" y2="14"/>
      <line x1="12" y1="14" x2="17" y2="19"/>
    </g>
    <text x="0" y="32" text-anchor="middle" font-size="9" fill="#e9dcae"
          font-family="'Special Elite','Courier New',monospace">PAÍS</text>
  </g>

  <!-- Resplandor del lampazo -->
  <circle cx="392" cy="180" r="200" fill="url(#screenGlow)" class="glow"/>

  <!-- ══ Escritorio ══ -->
  <rect x="300" y="430" width="500" height="30" fill="url(#desk)"/>
  <rect x="300" y="430" width="500" height="5" fill="#6e4a2a"/>
  <rect x="300" y="458" width="500" height="8" fill="#160d07"/>

  <!-- Monitor grande con el código verde -->
  <g>
    <rect x="440" y="196" width="252" height="180" rx="8" fill="#050b14" stroke="#14294a" stroke-width="3"/>
    <rect x="450" y="206" width="232" height="160" rx="4" fill="#08121f"/>
    <!-- resplandor eléctrico -->
    <rect x="450" y="206" width="232" height="36" fill="#1a4d63" opacity="0.18"/>
    <!-- renglones del código -->
    <g>
      <rect class="ln" x="458" y="216" width="96" height="6" rx="3" fill="#37d996"/>
      <rect class="ln ln--2" x="458" y="230" width="142" height="6" rx="3" fill="#2e8f6b"/>
      <rect class="ln ln--3" x="458" y="244" width="64" height="6" rx="3" fill="#4db7d6"/>
      <rect class="ln ln--4" x="458" y="258" width="118" height="6" rx="3" fill="#37d996"/>
      <rect class="ln ln--5" x="458" y="272" width="168" height="6" rx="3" fill="#2e8f6b"/>
      <rect class="ln ln--6" x="458" y="286" width="82" height="6" rx="3" fill="#4db7d6"/>
      <rect class="ln" x="458" y="300" width="126" height="6" rx="3" fill="#37d996"/>
      <rect class="ln ln--2" x="458" y="314" width="58" height="6" rx="3" fill="#2e8f6b"/>
      <rect class="ln ln--3" x="458" y="328" width="150" height="6" rx="3" fill="#4db7d6"/>
      <rect class="ln ln--4" x="458" y="342" width="104" height="6" rx="3" fill="#37d996"/>
      <rect class="cursor" x="536" y="328" width="11" height="8" fill="#d7e8e0"/>
    </g>
    <!-- pies del monitor -->
    <path d="M560 376 L572 376 L580 404 L552 404 Z" fill="#0b1524"/>
    <ellipse cx="566" cy="406" rx="42" ry="6" fill="#0b1524"/>
    <!-- post-it -->
    <rect x="676" y="206" width="26" height="26" fill="#ffd66b" stroke="#8a6a16" stroke-width="1.5" transform="rotate(4 689 219)"/>
    <rect x="676" y="240" width="26" height="26" fill="#ff8f7e" stroke="#8a4a40" stroke-width="1.5" transform="rotate(-3 689 253)"/>
  </g>

  <!-- Panel HUD flotante, aire anime -->
  <g>
    <rect x="712" y="216" width="74" height="118" rx="6" fill="#071019" stroke="#1f5f7d" stroke-width="2"/>
    <g fill="#4db7d6">
      <rect x="720" y="228" width="10" height="34" opacity="0.85"/>
      <rect x="734" y="238" width="10" height="24" opacity="0.55"/>
      <rect x="748" y="224" width="10" height="38" opacity="0.9"/>
      <rect x="762" y="246" width="10" height="16" opacity="0.4"/>
    </g>
    <g fill="#37d996">
      <rect x="720" y="276" width="58" height="5" rx="2.5" opacity="0.8"/>
      <rect x="720" y="287" width="40" height="5" rx="2.5" opacity="0.6"/>
      <rect x="720" y="298" width="50" height="5" rx="2.5" opacity="0.7"/>
    </g>
    <rect class="ln ln--5" x="720" y="314" width="58" height="8" rx="2" fill="#173246"/>
    <path d="M712 275 L692 275" stroke="#1f5f7d" stroke-width="1.6" stroke-dasharray="4 4"/>
  </g>

  <!-- ══ El coder, perfil nocturno con capucha ══ -->
  <g>
    <!-- torso encapuchado -->
    <path d="M40 600 C40 470 62 384 132 342 C176 315 224 306 258 316
             C286 324 316 344 336 376 C362 420 370 470 374 600 Z"
          fill="#0c1322"/>
    <!-- interior del capuchón, fileteado criollo -->
    <path d="M232 318 Q266 300 300 320 L290 342 Q264 328 240 340 Z"
          fill="#8a2f1c"/>
    <!-- mano y brazo hacia el teclado -->
    <path d="M270 356 C306 372 344 392 376 412 L366 434 C332 418 300 400 268 386 Z"
          fill="#0d1626"/>
    <ellipse cx="378" cy="424" rx="14" ry="8" fill="#0d1626"/>
    <!-- cabeza inclinada hacia la pantalla -->
    <path d="M244 226 C250 196 272 178 300 182 C334 188 356 218 350 252
             C346 276 332 292 312 300 C288 308 264 300 250 282
             C240 268 240 244 244 226 Z" fill="#0e1830"/>
    <!-- melena/sombrero de pelo -->
    <path d="M244 226 C250 194 274 176 302 182 C338 190 358 222 350 256
             C348 264 344 272 338 278 C334 248 310 228 284 226
             C266 224 252 230 244 226 Z" fill="#04060e"/>
    <!-- perfil iluminado por el monitor -->
    <path d="M306 202 C326 214 338 232 336 250 C335 264 326 276 312 282"
          fill="none" stroke="#4db7d6" stroke-width="3" stroke-linecap="round"/>
    <path d="M296 292 C310 296 324 300 336 306" fill="none"
          stroke="#37d996" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- luz del monitor sobre la capucha -->
    <path d="M262 322 C296 306 332 306 358 330 C336 350 296 348 262 322 Z"
          fill="#173952" opacity="0.55"/>
    <!-- cordones de la capucha -->
    <g stroke="#e9dcae" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="286" y1="336" x2="284" y2="356"/>
      <line x1="298" y1="334" x2="300" y2="352"/>
    </g>
  </g>

  <!-- ══ Mate con bombilla, fiel compañero ══ -->
  <g transform="translate(735 342)">
    <ellipse cx="0" cy="86" rx="30" ry="8" fill="#0a0603"/>
    <path d="M0 8 C-16 16 -22 40 -14 62 Q-10 78 0 78 Q10 78 14 62 C22 40 16 16 0 8 Z"
          fill="#6b3d1f" stroke="#241408" stroke-width="2"/>
    <ellipse cx="0" cy="8" rx="10" ry="4.5" fill="#33200f"/>
    <circle cx="-4" cy="44" r="9" fill="#c69a37"/>
    <g stroke="#c69a37" stroke-width="1.6" stroke-linecap="round">
      <line x1="-4" y1="30" x2="-4" y2="58"/>
      <line x1="-18" y1="44" x2="10" y2="44"/>
    </g>
    <path d="M12 -12 L4 6" stroke="#b8c4cc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12.5" cy="-13" r="3.5" fill="#b8c4cc"/>
    <!-- vapor -->
    <path class="steam" d="M0 -6 q 5 -8 0 -16 q -5 -8 0 -16" fill="none"
          stroke="#e9dcae" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path class="steam steam--2" d="M6 -2 q 6 -10 0 -20 q -5 -9 2 -18" fill="none"
          stroke="#e9dcae" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Teclado -->
  <g>
    <rect x="392" y="414" width="196" height="14" rx="4" fill="#111b2c" stroke="#233a50" stroke-width="1.5"/>
    <g fill="#37d996">
      <rect x="400" y="419" width="10" height="4" opacity="0.95"/>
      <rect x="414" y="419" width="10" height="4" opacity="0.4"/>
      <rect x="428" y="419" width="10" height="4" opacity="0.8"/>
      <rect x="442" y="419" width="10" height="4" opacity="0.35"/>
      <rect x="456" y="419" width="10" height="4" opacity="0.65"/>
      <rect x="470" y="419" width="10" height="4" opacity="0.5"/>
      <rect x="484" y="419" width="10" height="4" opacity="0.85"/>
      <rect x="498" y="419" width="10" height="4" opacity="0.3"/>
      <rect x="512" y="419" width="10" height="4" opacity="0.7"/>
      <rect x="526" y="419" width="10" height="4" opacity="0.45"/>
      <rect x="540" y="419" width="10" height="4" opacity="0.9"/>
      <rect x="554" y="419" width="10" height="4" opacity="0.4"/>
      <rect x="568" y="419" width="14" height="4" opacity="0.6"/>
    </g>
  </g>

  <!-- Reflexiones flotantes de escritorio -->
  <g fill="#4db7d6">
    <rect x="330" y="486" width="90" height="3" rx="1.5" opacity="0.16"/>
    <rect x="300" y="512" width="60" height="3" rx="1.5" opacity="0.1"/>
    <rect x="680" y="490" width="70" height="3" rx="1.5" opacity="0.12"/>
  </g>

  <!-- Texto vertical japonés -->
  <text x="779" y="34" font-size="21" fill="#4db7d6" opacity="0.85"
        writing-mode="vertical-rl" letter-spacing="7" font-family="'Noto Serif JP',serif">経験・夜勤</text>

  <!-- Leyenda tiptográfica -->
  <text x="40" y="566" font-size="13" fill="#e9dcae" opacity="0.7"
        font-family="'Special Elite','Courier New',monospace" letter-spacing="2">OPERATIONS ✶ 夜勤 ✶ 3:47 AM</text>

  <!-- Franja de poncho -->
  <rect x="0" y="580" width="800" height="20" fill="url(#poncho)"/>
  <rect x="0" y="578" width="800" height="3" fill="#2b1c10" opacity="0.7"/>
</svg>
